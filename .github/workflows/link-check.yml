name: Link check report

on:
  schedule:
    - cron: "20 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build link report
        run: python3 automation/check_links.py --output link-check-report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-check-report.json
